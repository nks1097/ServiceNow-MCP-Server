[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "servicenow-mcp-server"
version = "1.0.0"
description = "Enterprise ServiceNow Model Context Protocol (MCP) Server with 97 tools for ITSM, Service Catalog, Change Management, Agile/Scrum, Workflows, CMDB, and SecOps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Natanael Krindges", email = "natanael1097@gmail.com" }
]
keywords = [
    "servicenow",
    "mcp",
    "model-context-protocol",
    "itsm",
    "cmdb",
    "change-management",
    "incident-management",
    "ai-agent",
    "soar",
    "secops"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0"
]

[project.urls]
Homepage = "https://github.com/nks1097/ServiceNow-MCP-Server"
Repository = "https://github.com/nks1097/ServiceNow-MCP-Server.git"
Issues = "https://github.com/nks1097/ServiceNow-MCP-Server/issues"

[project.scripts]
servicenow-mcp = "servicenow_mcp_server:main"
