version: '3.8'

services:
  servicenow-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: servicenow-mcp-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONIOENCODING=utf-8
      - FASTMCP_LOG_LEVEL=INFO
    stdin_open: true
    tty: true
